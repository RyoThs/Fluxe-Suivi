# Filet de sécurité : lance tous les tests automatiques
# - à chaque proposition de modification (pull request),
# - à chaque mise à jour de la branche main.
# Résultat visible sur GitHub : ✅ tout va bien, ❌ quelque chose est cassé.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer l’outil de test
        run: npm ci
      - name: Installer le navigateur de test
        run: npx playwright install chromium
      # Paquets système (polices…) : souvent déjà présents sur GitHub. Si les serveurs Ubuntu sont en panne,
      # on continue quand même : s'il manquait vraiment quelque chose, les tests échoueraient clairement.
      - name: Installer les paquets système du navigateur (si possible)
        timeout-minutes: 4
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Lancer les tests
        run: npm test
