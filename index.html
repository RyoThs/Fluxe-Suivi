<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Fluxe Suivi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fluxe Suivi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#040814" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-startup-image" href="icons/splash.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Thème sombre par défaut (comme l'icône), thème clair automatique selon le téléphone */
:root{--bg:#040814;--surface:#0d1428;--raise:#151e3a;--ink:#eef2ff;--muted:#8b95b8;--line:#1f2a4d;--accent:#8b9bff;--on:#06091a;--grad:linear-gradient(135deg,#5eead4,#818cf8 55%,#c084fc);--tint:rgba(139,155,255,.16);--ok:#34d399;--danger:#fb7185;--shadow:0 10px 30px rgba(0,0,0,.45);--num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f5fb;--surface:#fff;--raise:#eef1fa;--ink:#0b1022;--muted:#69718f;--line:#e0e5f2;--accent:#4f46e5;--tint:rgba(79,70,229,.1);--ok:#0f9d6b;--danger:#e11d48;--shadow:0 8px 24px rgba(11,16,34,.08);color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{max-width:560px;margin:0 auto;padding:0 14px calc(170px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--num);font-weight:800;font-size:46px;line-height:1.05;margin:24px 4px 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content;max-width:100%}
h1::first-letter{text-transform:uppercase}
h2{font-family:var(--num);font-size:26px;font-weight:800;margin:22px 4px 10px}
.sub{margin:0 4px 18px;color:var(--muted);font-size:15px}
.mu{color:var(--muted);font-size:13px;margin:2px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.stats{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.stats div{flex:1;padding:12px 8px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--num);font-size:34px;font-weight:700;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-family:var(--num);font-size:32px;font-weight:800;line-height:1.05}
.prev{display:inline-block;margin:8px 0 10px;padding:5px 11px;border-radius:999px;background:var(--raise);color:var(--muted);font-size:13px;line-height:1.35}
.plate{width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:18px}
.pr{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--grad);color:var(--on);font-size:11px;font-weight:800}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;transition:transform .12s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:999px;background:var(--grad);color:var(--on);font-weight:800;font-size:17px}
.btn.big{padding:20px;font-size:19px}
.sec{width:100%;padding:14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:15px}
.del{color:var(--danger);font-size:14px;padding:6px 10px;border-radius:10px;font-weight:500}
.row{display:grid;gap:10px;margin-bottom:14px}
.dat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.empty{margin:36px 24px;text-align:center;color:var(--muted);line-height:1.5}
.hist-date{font-weight:700;font-size:17px}
.hist-ex{margin-top:12px}
.hist-ex b{font-family:var(--num);font-size:23px;font-weight:700}
.hist-ex div{color:var(--muted);font-size:15px;line-height:1.4}
.gr{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:8px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:14px}
.gh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center}
.gr .pv{text-align:center;color:var(--muted);font-size:14px}
.gr input{width:100%;min-width:0;text-align:center;font-family:var(--num);font-size:24px;font-weight:700;padding:8px 0;border:0;border-radius:12px;background:var(--raise);color:var(--ink)}
.gr.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ck{width:40px;height:40px;border-radius:12px;background:var(--raise);color:var(--muted);font-size:20px;font-weight:700}
.gr.ok .ck{background:var(--ok);color:var(--on)}
.ghost{width:100%;margin-top:6px;padding:12px;border-radius:14px;background:var(--raise);font-weight:600;color:var(--accent)}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);z-index:20}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 4px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
nav button[aria-current=true]{background:var(--grad);color:var(--on)}
#timer{position:fixed;left:14px;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:22px;padding:12px 14px 14px;display:none;z-index:21;box-shadow:var(--shadow)}
#timer.on{display:block}
.tr{display:flex;align-items:center;gap:8px}
.tr .lbl{font-size:14px;color:var(--muted)}
#timer .t{font-family:var(--num);font-size:44px;font-weight:700;flex:1;line-height:1}
#timer button{background:var(--surface);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--grad)}
#sheet{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px;overflow:auto;max-width:560px;margin:0 auto}
#sheet.on{display:block}
.sh-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--num);font-size:30px;font-weight:800;margin-bottom:12px}
#pq,#dq,#gq{width:100%;font:inherit;font-size:17px;padding:14px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--grad);color:var(--on);border-color:transparent}
.pi{display:flex;justify-content:flex-start;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.pi span{color:var(--muted);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--muted);gap:4px}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--grad);min-height:3px}
.rec{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec b{font-family:var(--num);font-size:22px;font-weight:700}
.rec span{color:var(--muted);font-size:14px}
#inst{position:fixed;left:14px;right:14px;max-width:532px;margin:0 auto;top:calc(10px + env(safe-area-inset-top,0px));z-index:30;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
#inst[hidden]{display:none}
#inst span{flex:1;font-size:14px;padding-left:6px}
#ib{padding:9px 16px;border-radius:999px;background:var(--grad);color:var(--on);font-weight:800}
#ix{padding:8px 10px;color:var(--muted)}
.sg{display:block;width:100%;text-align:left;margin:8px 0 4px;padding:10px 14px;border-radius:14px;background:var(--tint);color:var(--accent);font-weight:700;font-size:15px}
.sg small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.note{width:100%;margin:8px 0 4px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--ink);font:inherit;font-size:14px}
.plate.wu{background:var(--raise);color:var(--muted)}
.mg{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.mg div{height:8px;border-radius:4px;background:var(--raise);overflow:hidden}
.mg i{display:block;height:100%;background:var(--grad)}
.mg b{text-align:right;font-family:var(--num);font-size:18px}
.mi{position:relative;flex:none;width:48px;height:48px;border-radius:12px;background:var(--raise);color:var(--accent);display:grid;place-items:center;overflow:hidden}
.mi.lg{width:76px;height:76px;border-radius:16px}
.mi.sm{width:40px;height:40px;border-radius:10px}
.mi svg{width:62%;height:62%}
.mi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pt{flex:1;min-width:0;text-align:left}
.pt b,.pt span,.pt small{display:block}
.pt small{color:var(--muted);font-size:11px;word-break:break-all;margin-top:2px}
.gi{display:flex;align-items:center;gap:14px;padding:12px;margin-bottom:10px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.eh{display:flex;align-items:center;gap:12px;min-width:0}
nav button[data-tab=aide]{flex:0 0 56px;font-size:20px;font-weight:800;padding:12px 0}
@media (max-width:400px){nav button svg{display:none}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div id="inst" hidden><span>Installer Fluxe sur ton téléphone</span><button id="ib">Installer</button><button id="ix" aria-label="Fermer">✕</button></div>
<div id="app"></div>
<div id="timer" role="timer"><div class="tr"><span class="lbl">Repos</span><span class="t" id="tt">1:30</span><button data-act="t+">+15 s</button><button data-act="t0">Passer</button></div><div class="bar"><i id="tb"></i></div></div>
<nav><button data-tab="seance"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séance</button><button data-tab="histo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button><button data-tab="stats"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button><button data-tab="aide" aria-label="Guide des machines">?</button></nav>
<div id="sheet" role="dialog" aria-label="Choisir un exercice"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script src="app.js" defer></script>
</body>
</html>
