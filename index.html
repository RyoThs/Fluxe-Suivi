<body>
<div id="warn" hidden role="alert"></div>
<div id="inst" hidden><span>Installer Fluxe sur ton téléphone</span><button id="ib">Installer</button><button id="ix" aria-label="Fermer">✕</button></div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="timer" role="timer"><div class="tr"><span class="lbl">Repos</span><span class="t" id="tt">1:30</span><button data-act="t+">+15 s</button><button data-act="t0">Passer</button></div><div class="bar"><i id="tb"></i></div></div>
<nav><button data-tab="seance"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séance</button><button data-tab="histo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button><button data-tab="stats"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button><button data-tab="aide" aria-label="Guide des machines">?</button></nav>
<div id="sheet" role="dialog" aria-label="Choisir un exercice"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
