<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séries</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Séries">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f5bff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f2f7;--surface:#fff;--raise:#f3f4fa;--ink:#12172b;--muted:#7a8196;--line:#e3e6ef;--accent:#3d5cff;--accent-ink:#fff;--tint:rgba(61,92,255,.11);--ok:#12a672;--danger:#e5484d;
--shadow:0 1px 2px rgba(18,23,43,.05),0 10px 28px rgba(18,23,43,.07);
--num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f1c;--surface:#151b2e;--raise:#1d2540;--ink:#eef1fb;--muted:#8b94ae;--line:#263050;--accent:#6b86ff;--accent-ink:#0b0f1c;--tint:rgba(107,134,255,.16);--ok:#3cc28f;--danger:#ef6b6b;--shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{max-width:560px;margin:0 auto;padding:0 14px calc(170px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--num);font-weight:800;font-size:46px;line-height:1;margin:24px 4px 6px}
h1::first-letter{text-transform:uppercase}
.sub{margin:0 4px 18px;color:var(--muted);font-size:15px}
.card{background:var(--surface);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.stats{display:flex;background:var(--surface);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.stats div{flex:1;padding:12px 8px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--num);font-size:34px;font-weight:700;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-family:var(--num);font-size:32px;font-weight:800;line-height:1.05}
.prev{display:inline-block;margin:8px 0 10px;padding:5px 11px;border-radius:999px;background:var(--raise);color:var(--muted);font-size:13px;line-height:1.35}
.set{display:flex;align-items:center;gap:12px;padding:7px 0}
.plate{width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:18px;flex:none}
.set .v{font-family:var(--num);font-size:29px;font-weight:600;flex:1;line-height:1}
.set .v small{font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted)}
.pr{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-family:var(--body);font-size:12px;font-weight:700;vertical-align:middle}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--raise);border-radius:20px;padding:12px 10px;margin:12px 0}
.fld label{display:block;font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.stp{display:flex;align-items:center;gap:2px}
.stp input{flex:1;min-width:0;width:100%;text-align:center;border:0;background:transparent;font-family:var(--num);font-size:42px;font-weight:700;color:var(--ink);padding:0;outline-offset:2px}
.rd{width:38px;height:38px;border-radius:50%;padding:0;background:var(--surface);color:var(--ink);font-size:22px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.14);flex:none}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;transition:transform .12s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn.big{padding:20px;font-size:19px}
.sec{width:100%;padding:15px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.del{color:var(--danger);font-size:14px;padding:6px 10px;border-radius:10px;font-weight:500}
.add-ex{display:flex;gap:8px;margin-bottom:14px}
.add-ex input{flex:1;min-width:0;font:inherit;font-size:17px;padding:14px 18px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.add-ex .btn{width:auto;padding:0 24px}
.row{margin-bottom:14px}
.empty{margin:36px 24px;text-align:center;color:var(--muted);line-height:1.5}
.hist-date{font-weight:700;font-size:17px}
.hist-ex{margin-top:12px}
.hist-ex b{font-family:var(--num);font-size:23px;font-weight:700}
.hist-ex div{color:var(--muted);font-size:15px;line-height:1.4}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);z-index:20}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px}
nav button[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
#timer{position:fixed;left:14px;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:22px;padding:12px 14px 14px;display:none;z-index:21;box-shadow:0 12px 30px rgba(0,0,0,.25)}
#timer.on{display:block}
.tr{display:flex;align-items:center;gap:8px}
.tr .lbl{font-size:14px;opacity:.7}
#timer .t{font-family:var(--num);font-size:44px;font-weight:700;flex:1;line-height:1}
#timer button{background:rgba(127,127,127,.28);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600}
.bar{height:4px;border-radius:2px;background:rgba(127,127,127,.3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer" role="timer"><div class="tr"><span class="lbl">Repos</span><span class="t" id="tt">1:30</span><button data-act="t+">+15 s</button><button data-act="t0">Passer</button></div><div class="bar"><i id="tb"></i></div></div>
<nav><button data-tab="seance"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séance</button><button data-tab="histo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button></nav>

<script>
(function(){
const KEY='muscu-v1';
let S=load(), tab='seance';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.sessions)return d}catch(e){}return{sessions:[],current:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDate=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtSet=s=>s.kg+' kg × '+s.reps;
const cur=()=>S.sessions.find(s=>s.id===S.current);
const norm=n=>n.trim().toLowerCase();

function lastSets(name,excludeId){
  const l=S.sessions.filter(s=>s.id!==excludeId).sort((a,b)=>b.date-a.date);
  for(const s of l){const e=s.exercises.find(e=>norm(e.name)===norm(name));if(e&&e.sets.length)return e.sets}
  return null;
}
function bestKg(name,excludeId){
  let m=0;S.sessions.forEach(s=>{if(s.id===excludeId)return;s.exercises.forEach(e=>{if(norm(e.name)===norm(name))e.sets.forEach(x=>{if(+x.kg>m)m=+x.kg})})});return m;
}
function names(){const set=new Set();S.sessions.forEach(s=>s.exercises.forEach(e=>set.add(e.name)));return [...set]}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
  $('#app').innerHTML=tab==='seance'?viewSeance():viewHisto();
}

const DB='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>';
function stats(s){let n=0,v=0;s.exercises.forEach(e=>e.sets.forEach(x=>{n++;v+=(+x.kg)*(+x.reps)}));return{ex:s.exercises.length,sets:n,vol:Math.round(v).toLocaleString('fr-FR')}}
function viewSeance(){
  const s=cur();
  if(!s){
    const last=[...S.sessions].sort((a,b)=>b.date-a.date)[0];
    return `<h1>Séries</h1><p class="sub">Note chaque série pendant ta séance.</p>
    <div class="card"><button class="btn big" data-act="start">${DB} Démarrer une séance</button></div>
    ${last?`<div class="card"><div class="hist-date">Dernière séance</div><div class="sub" style="margin:2px 0 0">${esc(fmtDate(last.date))}</div>${last.exercises.map(e=>`<div class="hist-ex"><b>${esc(e.name)}</b><div>${e.sets.length} série${e.sets.length>1?'s':''}</div></div>`).join('')}</div>`:'<p class="empty">Aucune séance enregistrée pour l’instant.</p>'}`;
  }
  const st=stats(s),dl=names().map(n=>`<option value="${esc(n)}">`).join('');
  return `<h1>${esc(fmtDate(s.date))}</h1><p class="sub">Séance en cours</p>
  <div class="stats"><div><b>${st.ex}</b><span>exercices</span></div><div><b>${st.sets}</b><span>séries</span></div><div><b>${st.vol}</b><span>kg soulevés</span></div></div>
  ${s.exercises.map((e,i)=>exCard(s,e,i)).join('')||'<p class="empty">Ajoute ton premier exercice ci-dessous.</p>'}
  <form class="add-ex" onsubmit="return false"><input id="newex" list="exlist" placeholder="Nom de l’exercice" autocomplete="off" enterkeyhint="done" aria-label="Nom de l’exercice"><datalist id="exlist">${dl}</datalist><button type="button" class="btn" data-act="addex">Ajouter</button></form>
  <div class="row"><button class="sec" data-act="finish">Terminer la séance</button></div>`;
}
function exCard(s,e,i){
  const prev=lastSets(e.name,s.id),best=bestKg(e.name,s.id),d=e.draft||(e.draft=defDraft(e,prev));
  const fld=(f,id,lab,mode,step)=>`<div class="fld"><label for="${id}${i}">${lab}</label><div class="stp"><button class="rd" data-act="step" data-i="${i}" data-f="${f}" data-s="-${step}" aria-label="Diminuer">−</button><input id="${id}${i}" type="text" inputmode="${mode}" data-d="${f}" data-i="${i}" value="${esc(d[f])}"><button class="rd" data-act="step" data-i="${i}" data-f="${f}" data-s="${step}" aria-label="Augmenter">+</button></div></div>`;
  return `<section class="card"><div class="ex-head"><div class="ex-name">${esc(e.name)}</div><button class="del" data-act="delex" data-i="${i}">Retirer</button></div>
  <div class="prev">${prev?'Dernière fois : '+prev.map(fmtSet).join(' · '):'Première fois sur cet exercice'}</div>
  ${e.sets.map((x,j)=>`<div class="set"><span class="plate">${j+1}</span><span class="v">${esc(x.kg)} <small>kg</small> × ${esc(x.reps)}${best&&+x.kg>best?'<span class="pr">record</span>':''}</span><button class="del" data-act="delset" data-i="${i}" data-j="${j}" aria-label="Supprimer la série ${j+1}">✕</button></div>`).join('')}
  <div class="pad">${fld('kg','kg','Charge (kg)','decimal','2.5')}${fld('reps','rp','Répétitions','numeric','1')}</div>
  <button class="btn" data-act="addset" data-i="${i}">Valider la série</button></section>`;
}
function defDraft(e,prev){
  const l=e.sets[e.sets.length-1]||(prev&&prev[0]);
  return l?{kg:l.kg,reps:l.reps}:{kg:'',reps:''};
}

function viewHisto(){
  const l=[...S.sessions].filter(s=>s.exercises.some(e=>e.sets.length)||s.id!==S.current).sort((a,b)=>b.date-a.date);
  if(!l.length)return `<h1>Historique</h1><p class="empty">Tes séances terminées apparaîtront ici.</p>`;
  return `<h1>Historique</h1><p class="sub">${l.length} séance${l.length>1?'s':''}</p>
  ${l.map(s=>`<div class="card"><div class="ex-head"><div class="hist-date">${esc(fmtDate(s.date))}${s.id===S.current?' (en cours)':''}</div><button class="del" data-act="delsess" data-id="${s.id}">Supprimer</button></div>
  ${s.exercises.map(e=>`<div class="hist-ex"><b>${esc(e.name)}</b><div>${e.sets.length?e.sets.map(fmtSet).join(' · '):'Aucune série'}</div></div>`).join('')||'<div class="prev">Aucun exercice</div>'}</div>`).join('')}
  <div class="row"><button class="sec" data-act="export">Copier mes données</button></div>`;
}

/* Minuteur de repos */
let tEnd=0,tInt=null,rest=90,tTot=90000;
function tStart(){tTot=rest*1000;tEnd=Date.now()+tTot;$('#timer').classList.add('on');tick();clearInterval(tInt);tInt=setInterval(tick,250)}
function tick(){
  const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  $('#tt').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
  $('#tb').style.width=(Math.max(0,tEnd-Date.now())/tTot*100)+'%';
  if(r<=0){clearInterval(tInt);beep();setTimeout(()=>$('#timer').classList.remove('on'),2500)}
}
function tStop(){clearInterval(tInt);$('#timer').classList.remove('on')}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(c.currentTime+.35);if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}

/* Actions */
document.addEventListener('input',ev=>{
  const t=ev.target;if(!t.dataset.d)return;
  const e=cur().exercises[+t.dataset.i];e.draft=e.draft||{kg:'',reps:''};e.draft[t.dataset.d]=t.value;save();
});
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,s=cur(),i=+b.dataset.i,j=+b.dataset.j;
  if(a==='t+'){tEnd+=15000;tTot+=15000;tick();return}
  if(a==='step'){const e=s.exercises[i],f=b.dataset.f;const d=e.draft||(e.draft={kg:'',reps:''});let v=parseFloat(String(d[f]).replace(',','.'))||0;v=Math.max(0,Math.round((v+parseFloat(b.dataset.s))*100)/100);d[f]=String(v);document.getElementById((f==='kg'?'kg':'rp')+i).value=d[f];save();return}
  if(a==='t0'){tStop();return}
  if(a==='start'){const n={id:uid(),date:Date.now(),exercises:[]};S.sessions.push(n);S.current=n.id}
  else if(a==='addex'){const v=$('#newex').value.trim();if(!v){$('#newex').focus();return}s.exercises.push({name:v,sets:[]})}
  else if(a==='delex'){if(!confirm('Retirer cet exercice ?'))return;s.exercises.splice(i,1)}
  else if(a==='addset'){
    const e=s.exercises[i],d=e.draft||{};
    const kg=String(d.kg||'').replace(',','.').trim(),reps=String(d.reps||'').trim();
    if(kg===''||!reps||isNaN(+kg)||isNaN(+reps)){alert('Renseigne la charge et les répétitions.');return}
    e.sets.push({kg,reps});e.draft={kg,reps};tStart();
  }
  else if(a==='delset'){s.exercises[i].sets.splice(j,1)}
  else if(a==='finish'){
    if(!confirm('Terminer la séance ?'))return;
    s.exercises.forEach(e=>delete e.draft);
    s.exercises=s.exercises.filter(e=>e.sets.length);
    if(!s.exercises.length)S.sessions=S.sessions.filter(x=>x.id!==s.id);
    S.current=null;tStop();
  }
  else if(a==='delsess'){if(!confirm('Supprimer cette séance ?'))return;S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id);if(S.current===b.dataset.id)S.current=null}
  else if(a==='export'){
    const txt=JSON.stringify(S.sessions,null,1);
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('Données copiées.')).catch(()=>alert('Copie impossible sur ce navigateur.'));return;
  }
  save();render();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='newex'){ev.preventDefault();document.querySelector('[data-act=addex]').click()}});

/* Mode hors-ligne */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
})();
</script>
</body>
</html>

<style>
:root{
  --bg:#e8ebef;--surface:#fff;--ink:#14213d;--muted:#6b7686;--line:#d5dae1;
  --accent:#2f5bff;--accent-ink:#fff;--ok:#1f9d6b;--danger:#d64545;
  --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10141c;--surface:#1a202c;--ink:#eef1f6;--muted:#8f9aac;--line:#2b3445;--accent:#5b82ff;--ok:#3cc28f;--danger:#ef6b6b;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10141c;--surface:#1a202c;--ink:#eef1f6;--muted:#8f9aac;--line:#2b3445;--accent:#5b82ff;--ok:#3cc28f;--danger:#ef6b6b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
h1{font-family:var(--num);font-size:34px;margin:18px 16px 4px;letter-spacing:.2px}
.sub{margin:0 16px 14px;color:var(--muted);font-size:14px}
.card{background:var(--surface);border-radius:14px;margin:0 12px 12px;padding:14px;border:1px solid var(--line)}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-name{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.1}
.prev{color:var(--muted);font-size:13px;margin:4px 0 10px}
.set{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.set .n{width:26px;color:var(--muted);font-size:14px}
.set .v{font-family:var(--num);font-size:26px;font-weight:600;flex:1}
.set .v small{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:400}
.entry{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.entry label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input:not([type]){width:100%;font:inherit;font-size:20px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);padding:8px 10px}
button.sec{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
button.del{background:transparent;color:var(--danger);padding:6px 10px;font-weight:500}
button.big{width:100%;padding:16px;font-size:18px}
.entry button{align-self:end;padding:13px 16px}
.add-ex{display:flex;gap:8px;margin:0 12px 12px}
.add-ex input{flex:1}
.row{display:flex;gap:8px;margin:0 12px 12px}
.row button{flex:1}
.empty{margin:30px 24px;color:var(--muted);text-align:center;line-height:1.5}
.hist-date{font-weight:600}
.hist-ex{margin-top:8px;font-size:15px}
.hist-ex b{font-family:var(--num);font-size:20px;font-weight:700}
.hist-ex div{color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:20}
nav button{flex:1;background:transparent;color:var(--muted);border-radius:10px;font-size:15px}
nav button[aria-current=true]{color:var(--accent);background:var(--bg)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:21}
#timer.on{display:flex}
#timer .t{font-family:var(--num);font-size:34px;font-weight:700;flex:1}
#timer button{background:rgba(127,127,127,.3);color:inherit;padding:9px 12px}
.pr{color:var(--ok);font-size:13px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer" role="timer"><span>Repos</span><span class="t" id="tt">1:30</span><button data-act="t+">+15 s</button><button data-act="t0">Passer</button></div>
<nav><button data-tab="seance">Séance</button><button data-tab="histo">Historique</button></nav>

<script>
(function(){
const KEY='muscu-v1';
let S=load(), tab='seance';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.sessions)return d}catch(e){}return{sessions:[],current:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDate=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtSet=s=>s.kg+' kg × '+s.reps;
const cur=()=>S.sessions.find(s=>s.id===S.current);
const norm=n=>n.trim().toLowerCase();

function lastSets(name,excludeId){
  const l=S.sessions.filter(s=>s.id!==excludeId).sort((a,b)=>b.date-a.date);
  for(const s of l){const e=s.exercises.find(e=>norm(e.name)===norm(name));if(e&&e.sets.length)return e.sets}
  return null;
}
function bestKg(name,excludeId){
  let m=0;S.sessions.forEach(s=>{if(s.id===excludeId)return;s.exercises.forEach(e=>{if(norm(e.name)===norm(name))e.sets.forEach(x=>{if(+x.kg>m)m=+x.kg})})});return m;
}
function names(){const set=new Set();S.sessions.forEach(s=>s.exercises.forEach(e=>set.add(e.name)));return [...set]}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
  $('#app').innerHTML=tab==='seance'?viewSeance():viewHisto();
}

function viewSeance(){
  const s=cur();
  if(!s){
    const last=[...S.sessions].sort((a,b)=>b.date-a.date)[0];
    return `<h1>Séries</h1><p class="sub">Note chaque série pendant ta séance.</p>
    <div class="card"><button class="big" data-act="start">Démarrer une séance</button></div>
    ${last?`<div class="card"><div class="hist-date">Dernière séance</div><div class="prev">${esc(fmtDate(last.date))}</div>${last.exercises.map(e=>`<div class="hist-ex"><b>${esc(e.name)}</b><div>${e.sets.length} série${e.sets.length>1?'s':''}</div></div>`).join('')||'<div class="prev">Aucun exercice</div>'}</div>`:'<p class="empty">Aucune séance enregistrée pour l’instant.</p>'}`;
  }
  const dl=names().map(n=>`<option value="${esc(n)}">`).join('');
  return `<h1>Séance en cours</h1><p class="sub">${esc(fmtDate(s.date))}</p>
  ${s.exercises.map((e,i)=>exCard(s,e,i)).join('')||'<p class="empty">Ajoute ton premier exercice ci-dessous.</p>'}
  <form class="add-ex" data-form="addex" onsubmit="return false"><input id="newex" list="exlist" placeholder="Nom de l’exercice" autocomplete="off" enterkeyhint="done"><datalist id="exlist">${dl}</datalist><button type="button" data-act="addex">Ajouter</button></form>
  <div class="row"><button class="sec" data-act="finish">Terminer la séance</button></div>`;
}

function exCard(s,e,i){
  const prev=lastSets(e.name,s.id);
  const best=bestKg(e.name,s.id);
  const d=e.draft||(e.draft=defDraft(e,prev));
  return `<div class="card"><div class="ex-head"><div class="ex-name">${esc(e.name)}</div><button class="del" data-act="delex" data-i="${i}">Retirer</button></div>
  <div class="prev">${prev?'Dernière fois : '+prev.map(fmtSet).join(' · '):'Première fois sur cet exercice'}</div>
  ${e.sets.map((x,j)=>`<div class="set"><span class="n">${j+1}</span><span class="v">${esc(x.kg)} <small>kg</small> × ${esc(x.reps)}${best&&+x.kg>best?' <span class="pr">record</span>':''}</span><button class="del" data-act="delset" data-i="${i}" data-j="${j}" aria-label="Supprimer la série ${j+1}">✕</button></div>`).join('')}
  <div class="entry"><div><label for="kg${i}">Charge (kg)</label><input id="kg${i}" type="text" inputmode="decimal" data-d="kg" data-i="${i}" value="${esc(d.kg)}"></div>
  <div><label for="rp${i}">Répétitions</label><input id="rp${i}" type="text" inputmode="numeric" data-d="reps" data-i="${i}" value="${esc(d.reps)}"></div>
  <button data-act="addset" data-i="${i}">Valider</button></div></div>`;
}
function defDraft(e,prev){
  const l=e.sets[e.sets.length-1]||(prev&&prev[0]);
  return l?{kg:l.kg,reps:l.reps}:{kg:'',reps:''};
}

function viewHisto(){
  const l=[...S.sessions].filter(s=>s.exercises.some(e=>e.sets.length)||s.id!==S.current).sort((a,b)=>b.date-a.date);
  if(!l.length)return `<h1>Historique</h1><p class="empty">Tes séances terminées apparaîtront ici.</p>`;
  return `<h1>Historique</h1><p class="sub">${l.length} séance${l.length>1?'s':''}</p>
  ${l.map(s=>`<div class="card"><div class="ex-head"><div class="hist-date">${esc(fmtDate(s.date))}${s.id===S.current?' (en cours)':''}</div><button class="del" data-act="delsess" data-id="${s.id}">Supprimer</button></div>
  ${s.exercises.map(e=>`<div class="hist-ex"><b>${esc(e.name)}</b><div>${e.sets.length?e.sets.map(fmtSet).join(' · '):'Aucune série'}</div></div>`).join('')||'<div class="prev">Aucun exercice</div>'}</div>`).join('')}
  <div class="row"><button class="sec" data-act="export">Copier mes données</button></div>`;
}

/* Minuteur de repos */
let tEnd=0,tInt=null,rest=90;
function tStart(){tEnd=Date.now()+rest*1000;$('#timer').classList.add('on');tick();clearInterval(tInt);tInt=setInterval(tick,250)}
function tick(){
  const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  $('#tt').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
  if(r<=0){clearInterval(tInt);beep();setTimeout(()=>$('#timer').classList.remove('on'),2500)}
}
function tStop(){clearInterval(tInt);$('#timer').classList.remove('on')}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(c.currentTime+.35);if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}

/* Actions */
document.addEventListener('input',ev=>{
  const t=ev.target;if(!t.dataset.d)return;
  const e=cur().exercises[+t.dataset.i];e.draft=e.draft||{kg:'',reps:''};e.draft[t.dataset.d]=t.value;save();
});
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,s=cur(),i=+b.dataset.i,j=+b.dataset.j;
  if(a==='t+'){tEnd+=15000;tick();return}
  if(a==='t0'){tStop();return}
  if(a==='start'){const n={id:uid(),date:Date.now(),exercises:[]};S.sessions.push(n);S.current=n.id}
  else if(a==='addex'){const v=$('#newex').value.trim();if(!v){$('#newex').focus();return}s.exercises.push({name:v,sets:[]})}
  else if(a==='delex'){if(!confirm('Retirer cet exercice ?'))return;s.exercises.splice(i,1)}
  else if(a==='addset'){
    const e=s.exercises[i],d=e.draft||{};
    const kg=String(d.kg||'').replace(',','.').trim(),reps=String(d.reps||'').trim();
    if(kg===''||!reps||isNaN(+kg)||isNaN(+reps)){alert('Renseigne la charge et les répétitions.');return}
    e.sets.push({kg,reps});e.draft={kg,reps};tStart();
  }
  else if(a==='delset'){s.exercises[i].sets.splice(j,1)}
  else if(a==='finish'){
    if(!confirm('Terminer la séance ?'))return;
    s.exercises.forEach(e=>delete e.draft);
    s.exercises=s.exercises.filter(e=>e.sets.length);
    if(!s.exercises.length)S.sessions=S.sessions.filter(x=>x.id!==s.id);
    S.current=null;tStop();
  }
  else if(a==='delsess'){if(!confirm('Supprimer cette séance ?'))return;S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id);if(S.current===b.dataset.id)S.current=null}
  else if(a==='export'){
    const txt=JSON.stringify(S.sessions,null,1);
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>alert('Données copiées.')).catch(()=>alert('Copie impossible sur ce navigateur.'));return;
  }
  save();render();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='newex'){ev.preventDefault();document.querySelector('[data-act=addex]').click()}});

/* Mode hors-ligne */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
})();
</script>
</body>
</html>
