<!DOCTYPE html>

<head>
<meta charset="utf-8">

<meta name="referrer" content="no-referrer">
<title>Fluxe Suivi</title>
<meta name="app-version" content="3.12.0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fluxe Suivi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5fb">

<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-startup-image" href="icons/splash.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)">
<link rel="stylesheet" href="css/app.css?v=3.12.0">
</head>
<body>
<div id="warn" hidden role="alert"></div>
<div id="inst" hidden><span>Installer Fluxe sur ton téléphone</span><button id="ib">Installer</button><button id="ix" aria-label="Fermer">✕</button></div>
<div id="app"></div>
<div id="rot" role="alert"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><b>Tourne ton téléphone</b><span>Fluxe s’utilise en hauteur.</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="timer" role="timer"><div class="tr"><svg class="ring" viewBox="0 0 50 50" aria-hidden="true"><defs><linearGradient id="trg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d9488"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#9333ea"/></linearGradient></defs><circle class="rf" cx="25" cy="25" r="21"/><circle id="tr" cx="25" cy="25" r="21"/></svg><div class="tx"><span class="lbl">Repos</span><span class="t" id="tt">1:30</span></div><button data-act="t30" class="t30">+30 s</button><button data-act="t0" class="tp">Passer</button><button data-act="tcfg" class="tg" aria-expanded="false" aria-controls="tc" aria-label="Réglages du repos"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div><div id="tn"></div><div class="bar"><i id="tb"></i></div><div id="tc" hidden></div></div>
<nav><button data-tab="seance"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séance</button><button data-tab="histo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button><button data-tab="stats"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button><button data-tab="aide" aria-label="Guide des machines">?</button></nav>
<div id="sheet" role="dialog" aria-label="Choisir un exercice"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script type="module" src="js/main.js?v=3.12.0"></script>
</body>
</html>
