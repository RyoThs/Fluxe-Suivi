<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fluxe Suivi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fluxe Suivi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#040814">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-startup-image" href="icons/splash.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f2f7;--surface:#fff;--raise:#f3f4fa;--ink:#12172b;--muted:#7a8196;--line:#e3e6ef;--accent:#3d5cff;--accent-ink:#fff;--tint:rgba(61,92,255,.11);--ok:#12a672;--danger:#e5484d;
--shadow:0 1px 2px rgba(18,23,43,.05),0 10px 28px rgba(18,23,43,.07);
--num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f1c;--surface:#151b2e;--raise:#1d2540;--ink:#eef1fb;--muted:#8b94ae;--line:#263050;--accent:#6b86ff;--accent-ink:#0b0f1c;--tint:rgba(107,134,255,.16);--ok:#3cc28f;--danger:#ef6b6b;--shadow:0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{max-width:560px;margin:0 auto;padding:0 14px calc(170px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--num);font-weight:800;font-size:46px;line-height:1;margin:24px 4px 6px}
h1::first-letter{text-transform:uppercase}
.sub{margin:0 4px 18px;color:var(--muted);font-size:15px}
.card{background:var(--surface);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.stats{display:flex;background:var(--surface);border-radius:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.stats div{flex:1;padding:12px 8px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--num);font-size:34px;font-weight:700;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-family:var(--num);font-size:32px;font-weight:800;line-height:1.05}
.prev{display:inline-block;margin:8px 0 10px;padding:5px 11px;border-radius:999px;background:var(--raise);color:var(--muted);font-size:13px;line-height:1.35}
.set{display:flex;align-items:center;gap:12px;padding:7px 0}
.plate{width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:18px;flex:none}
.set .v{font-family:var(--num);font-size:29px;font-weight:600;flex:1;line-height:1}
.set .v small{font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted)}
.pr{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-family:var(--body);font-size:12px;font-weight:700;vertical-align:middle}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--raise);border-radius:20px;padding:12px 10px;margin:12px 0}
.fld label{display:block;font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.stp{display:flex;align-items:center;gap:2px}
.stp input{flex:1;min-width:0;width:100%;text-align:center;border:0;background:transparent;font-family:var(--num);font-size:42px;font-weight:700;color:var(--ink);padding:0;outline-offset:2px}
.rd{width:38px;height:38px;border-radius:50%;padding:0;background:var(--surface);color:var(--ink);font-size:22px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.14);flex:none}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;transition:transform .12s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn.big{padding:20px;font-size:19px}
.sec{width:100%;padding:15px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.del{color:var(--danger);font-size:14px;padding:6px 10px;border-radius:10px;font-weight:500}
.add-ex{display:flex;gap:8px;margin-bottom:14px}
.add-ex input{flex:1;min-width:0;font:inherit;font-size:17px;padding:14px 18px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.add-ex .btn{width:auto;padding:0 24px}
.row{margin-bottom:14px}
.empty{margin:36px 24px;text-align:center;color:var(--muted);line-height:1.5}
.hist-date{font-weight:700;font-size:17px}
.hist-ex{margin-top:12px}
.hist-ex b{font-family:var(--num);font-size:23px;font-weight:700}
.hist-ex div{color:var(--muted);font-size:15px;line-height:1.4}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);z-index:20}
nav button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:15px}
nav button[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
#timer{position:fixed;left:14px;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:22px;padding:12px 14px 14px;display:none;z-index:21;box-shadow:0 12px 30px rgba(0,0,0,.25)}
#timer.on{display:block}
.tr{display:flex;align-items:center;gap:8px}
.tr .lbl{font-size:14px;opacity:.7}
#timer .t{font-family:var(--num);font-size:44px;font-weight:700;flex:1;line-height:1}
#timer button{background:rgba(127,127,127,.28);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600}
.bar{height:4px;border-radius:2px;background:rgba(127,127,127,.3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){button{transition:none}}
h2{font-family:var(--num);font-size:26px;font-weight:800;margin:22px 4px 10px}
.mu{color:var(--muted);font-size:13px;margin:2px 0 10px}
.gr{display:grid;grid-template-columns:34px 1fr 1fr 1fr 44px;gap:8px;align-items:center;padding:6px 8px;margin:0 -8px;border-radius:14px}
.gh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center}
.gr .pv{text-align:center;color:var(--muted);font-size:14px}
.gr input{width:100%;min-width:0;text-align:center;font-family:var(--num);font-size:24px;font-weight:700;padding:8px 0;border:0;border-radius:12px;background:var(--raise);color:var(--ink)}
.gr.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.ck{width:40px;height:40px;border-radius:12px;background:var(--raise);color:var(--muted);font-size:20px;font-weight:700}
.gr.ok .ck{background:var(--ok);color:#fff}
.ghost{width:100%;margin-top:6px;padding:12px;border-radius:14px;background:var(--raise);font-weight:600;color:var(--accent)}
.row{display:grid;gap:10px}
#sheet{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 40px;overflow:auto;max-width:560px;margin:0 auto}
#sheet.on{display:block}
.sh-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--num);font-size:30px;font-weight:800;margin-bottom:12px}
#pq{width:100%;font:inherit;font-size:17px;padding:14px 18px;border-radius:999px;border:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.pi{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border-radius:16px;background:var(--surface)}
.pi span{color:var(--muted);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--muted);gap:4px}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:3px}
.rec{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}
.rec b{font-family:var(--num);font-size:22px;font-weight:700}
.rec span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="timer" role="timer"><div class="tr"><span class="lbl">Repos</span><span class="t" id="tt">1:30</span><button data-act="t+">+15 s</button><button data-act="t0">Passer</button></div><div class="bar"><i id="tb"></i></div></div>
<nav><button data-tab="seance"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séance</button><button data-tab="histo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button><button data-tab="stats"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button></nav>
<div id="sheet" role="dialog" aria-label="Choisir un exercice"></div>

<script>
(function(){
const KEY='muscu-v1';
const M=['Pectoraux','Dos','Jambes','Épaules','Bras','Abdos'];
const LIB=[['Développé couché','Pectoraux'],['Développé incliné haltères','Pectoraux'],['Écarté poulie','Pectoraux'],['Pompes','Pectoraux'],['Tractions','Dos'],['Rowing barre','Dos'],['Tirage vertical','Dos'],['Tirage horizontal','Dos'],['Soulevé de terre','Dos'],['Squat','Jambes'],['Presse à cuisses','Jambes'],['Fentes','Jambes'],['Leg curl','Jambes'],['Leg extension','Jambes'],['Hip thrust','Jambes'],['Mollets debout','Jambes'],['Développé militaire','Épaules'],['Élévations latérales','Épaules'],['Oiseau','Épaules'],['Curl barre','Bras'],['Curl marteau','Bras'],['Triceps poulie','Bras'],['Dips','Bras'],['Barre au front','Bras'],['Crunch','Abdos'],['Gainage','Abdos'],['Relevé de jambes','Abdos']];
const MU=Object.fromEntries(LIB);
const DB=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>`;
let S=load(),tab='seance',pk=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.sessions){d.routines=d.routines||[];return d}}catch(e){}return{sessions:[],routines:[],current:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=q=>document.querySelector(q);
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDate=t=>new Date(t).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const cur=()=>S.sessions.find(x=>x.id===S.current);
const norm=n=>n.trim().toLowerCase();
const dn=x=>x.done!==false;
const vol=s=>s.exercises.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(dn(x)?(+x.kg)*(+x.reps):0),0),0);
const nset=s=>s.exercises.reduce((a,e)=>a+e.sets.filter(dn).length,0);
const e1=x=>(+x.kg)*(1+(+x.reps)/30);
const fmt=n=>Math.round(n).toLocaleString('fr-FR');
const mins=t=>Math.max(0,Math.floor((Date.now()-t)/60000));
const done=()=>S.sessions.filter(x=>x.id!==S.current);
function prevSets(name,id){
  for(const s of done().sort((a,b)=>b.date-a.date)){const e=s.exercises.find(e=>norm(e.name)===norm(name));if(e){const l=e.sets.filter(dn);if(l.length)return l}}
  return null;
}
function newEx(name){const p=prevSets(name);return{name,sets:(p||[{kg:'',reps:''}]).map(x=>({kg:x.kg,reps:x.reps,done:false}))}}
function names(){const st=new Set();S.sessions.forEach(s=>s.exercises.forEach(e=>st.add(e.name)));return [...st]}

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
  $('#app').innerHTML=tab==='seance'?viewSeance():tab==='histo'?viewHisto():viewStats();
}
function viewSeance(){
  const s=cur();
  if(!s)return `<h1>Entraînement</h1><p class="sub">Lance une séance ou pars d’une routine.</p>
  <div class="card"><button class="btn big" data-act="start">${DB} Séance vide</button></div>
  <h2>Routines</h2>
  ${S.routines.map((r,k)=>`<div class="card"><div class="ex-head"><div class="ex-name">${esc(r.name)}</div><button class="del" data-act="delr" data-k="${k}">Supprimer</button></div><div class="prev">${r.exercises.map(esc).join(', ')}</div><button class="btn" data-act="startr" data-k="${k}">Démarrer</button></div>`).join('')||'<p class="empty">Termine une séance pour l’enregistrer comme routine.</p>'}`;
  return `<h1>${esc(fmtDate(s.date))}</h1><p class="sub">Séance en cours</p>
  <div class="stats"><div><b id="el">${mins(s.date)}</b><span>minutes</span></div><div><b>${nset(s)}</b><span>séries</span></div><div><b>${fmt(vol(s))}</b><span>kg soulevés</span></div></div>
  ${s.exercises.map((e,i)=>exCard(s,e,i)).join('')}
  <div class="row"><button class="btn" data-act="pick">+ Ajouter un exercice</button><button class="sec" data-act="finish">Terminer la séance</button><button class="del" data-act="cancel">Annuler la séance</button></div>`;
}
function exCard(s,e,i){
  const pv=prevSets(e.name)||[];
  return `<section class="card"><div class="ex-head"><div><div class="ex-name">${esc(e.name)}</div><div class="mu">${MU[e.name]||'Perso'}</div></div><button class="del" data-act="delex" data-i="${i}">Retirer</button></div>
  <div class="gr gh"><span>Série</span><span>Précédent</span><span>kg</span><span>Réps</span><span></span></div>
  ${e.sets.map((x,j)=>{const p=pv[j];return `<div class="gr${x.done?' ok':''}"><span class="plate">${j+1}</span><span class="pv">${p?esc(p.kg)+'×'+esc(p.reps):'–'}</span><input type="text" inputmode="decimal" data-i="${i}" data-j="${j}" data-f="kg" value="${esc(x.kg)}" aria-label="kg, série ${j+1}"><input type="text" inputmode="numeric" data-i="${i}" data-j="${j}" data-f="reps" value="${esc(x.reps)}" aria-label="Répétitions, série ${j+1}"><button class="ck" data-act="chk" data-i="${i}" data-j="${j}" aria-pressed="${!!x.done}" aria-label="Valider la série ${j+1}">✓</button></div>`}).join('')}
  <button class="ghost" data-act="addset" data-i="${i}">+ Ajouter une série</button></section>`;
}
function viewHisto(){
  const l=done().sort((a,b)=>b.date-a.date);
  if(!l.length)return `<h1>Historique</h1><p class="empty">Tes séances terminées apparaîtront ici.</p>`;
  return `<h1>Historique</h1><p class="sub">${l.length} séance${l.length>1?'s':''}</p>
  ${l.map(s=>`<div class="card"><div class="ex-head"><div><div class="hist-date">${esc(fmtDate(s.date))}</div><div class="mu">${nset(s)} séries · ${fmt(vol(s))} kg${s.dur?' · '+s.dur+' min':''}</div></div><button class="del" data-act="delsess" data-id="${s.id}">Supprimer</button></div>
  ${s.exercises.map(e=>{const d=e.sets.filter(dn);if(!d.length)return '';const b=d.reduce((a,x)=>e1(x)>e1(a)?x:a);return `<div class="hist-ex"><b>${esc(e.name)}</b><div>${d.length} série${d.length>1?'s':''} · meilleure ${esc(b.kg)} kg × ${esc(b.reps)}</div></div>`}).join('')}</div>`).join('')}
  <div class="row"><button class="sec" data-act="export">Copier mes données</button></div>`;
}
function wk(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function viewStats(){
  const l=done(),now=Date.now(),w0=wk(now),W=7*864e5;
  const weeks=[...Array(8)].map((_,k)=>{const t=w0-(7-k)*W;const v=l.filter(s=>wk(s.date)===t).reduce((a,s)=>a+vol(s),0);return{t,v}});
  const mx=Math.max(1,...weeks.map(x=>x.v));
  const best={};l.forEach(s=>s.exercises.forEach(e=>e.sets.filter(dn).forEach(x=>{const k=e.name;if(!best[k]||e1(x)>e1(best[k]))best[k]=x})));
  const rec=Object.entries(best).sort((a,b)=>e1(b[1])-e1(a[1])).slice(0,8);
  return `<h1>Stats</h1><p class="sub">Ta progression</p>
  <div class="stats"><div><b>${l.length}</b><span>séances</span></div><div><b>${l.filter(s=>now-s.date<W).length}</b><span>7 derniers jours</span></div><div><b>${fmt(l.reduce((a,s)=>a+vol(s),0))}</b><span>kg au total</span></div></div>
  <div class="card"><div class="hist-date">Volume par semaine</div><div class="mu">en kg, 8 dernières semaines</div><div class="chart" role="img" aria-label="Volume hebdomadaire">${weeks.map(x=>`<div><i style="height:${Math.round(x.v/mx*100)}px"></i>${new Date(x.t).getDate()}/${new Date(x.t).getMonth()+1}</div>`).join('')}</div></div>
  <div class="card"><div class="hist-date">Records</div><div class="mu">1RM estimé (formule d’Epley)</div>${rec.map(([n,x])=>`<div class="rec"><div>${esc(n)}<br><span>${esc(x.kg)} kg × ${esc(x.reps)}</span></div><b>${fmt(e1(x))} kg</b></div>`).join('')||'<p class="empty" style="margin:12px">Pas encore de records.</p>'}</div>`;
}

/* Sélecteur d’exercices */
function sheet(){
  const el=$('#sheet');
  if(!pk){el.className='';el.innerHTML='';return}
  el.className='on';
  el.innerHTML=`<div class="sh-top"><span>Exercices</span><button class="del" data-act="closepk" style="color:var(--accent);font-family:var(--body);font-size:16px">Fermer</button></div><input id="pq" placeholder="Rechercher ou créer" value="${esc(pk.q)}" autocomplete="off" aria-label="Rechercher"><div class="chips">${['Tous',...M].map(m=>`<button class="chip${pk.m===m?' on':''}" data-act="pm" data-m="${m}">${m}</button>`).join('')}</div><div id="pl">${plist()}</div>`;
}
function plist(){
  const q=norm(pk.q),own=names().filter(n=>!MU[n]).map(n=>[n,'Perso']);
  const l=[...LIB,...own].filter(([n,m])=>(pk.m==='Tous'||m===pk.m)&&norm(n).includes(q));
  const mk=(n,m,t)=>`<button class="pi" data-act="padd" data-n="${esc(n)}"><b>${t}</b><span>${m}</span></button>`;
  return l.map(([n,m])=>mk(n,m,esc(n))).join('')+(q&&![...LIB,...own].some(([n])=>norm(n)===q)?mk(pk.q.trim(),'Exercice perso','Créer « '+esc(pk.q.trim())+' »'):'');
}

/* Minuteur de repos */
let tEnd=0,tInt=null,rest=90,tTot=90000;
function tStart(){tTot=rest*1000;tEnd=Date.now()+tTot;$('#timer').classList.add('on');tick();clearInterval(tInt);tInt=setInterval(tick,250)}
function tick(){
  const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  $('#tt').textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
  $('#tb').style.width=(Math.max(0,tEnd-Date.now())/tTot*100)+'%';
  if(r<=0){clearInterval(tInt);beep();setTimeout(()=>$('#timer').classList.remove('on'),2500)}
}
function tStop(){clearInterval(tInt);$('#timer').classList.remove('on')}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(c.currentTime+.35);if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}
setInterval(()=>{const e=$('#el'),s=cur();if(e&&s)e.textContent=mins(s.date)},20000);

document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='pq'){pk.q=t.value;$('#pl').innerHTML=plist();return}
  if(!t.dataset.f)return;
  const x=cur().exercises[+t.dataset.i].sets[+t.dataset.j];x[t.dataset.f]=t.value.replace(',','.');save();
});
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,s=cur(),i=+b.dataset.i,j=+b.dataset.j,k=+b.dataset.k;
  if(a==='t+'){tEnd+=15000;tTot+=15000;tick();return}
  if(a==='t0'){tStop();return}
  if(a==='pm'){pk.m=b.dataset.m;sheet();return}
  if(a==='closepk'){pk=null;sheet();return}
  if(a==='pick'){pk={q:'',m:'Tous'};sheet();return}
  if(a==='padd'){s.exercises.push(newEx(b.dataset.n));pk=null;sheet()}
  else if(a==='start'){const n={id:uid(),date:Date.now(),exercises:[]};S.sessions.push(n);S.current=n.id}
  else if(a==='startr'){const n={id:uid(),date:Date.now(),exercises:[]};S.current=n.id;n.exercises=S.routines[k].exercises.map(newEx);S.sessions.push(n)}
  else if(a==='delr'){if(!confirm('Supprimer cette routine ?'))return;S.routines.splice(k,1)}
  else if(a==='delex'){if(!confirm('Retirer cet exercice ?'))return;s.exercises.splice(i,1)}
  else if(a==='addset'){const l=s.exercises[i].sets;const p=l[l.length-1]||{kg:'',reps:''};l.push({kg:p.kg,reps:p.reps,done:false})}
  else if(a==='chk'){
    const x=s.exercises[i].sets[j];
    if(!x.done){if(String(x.reps).trim()===''||isNaN(+x.reps)||isNaN(+x.kg)){alert('Renseigne les répétitions (et la charge).');return}if(String(x.kg).trim()==='')x.kg='0';x.done=true;tStart()}else x.done=false;
  }
  else if(a==='finish'){
    if(!confirm('Terminer la séance ?'))return;
    s.exercises.forEach(e=>e.sets=e.sets.filter(dn));s.exercises=s.exercises.filter(e=>e.sets.length);
    if(!s.exercises.length)S.sessions=S.sessions.filter(x=>x.id!==s.id);
    else{s.dur=mins(s.date);
      if(confirm('Enregistrer cette séance comme routine ?')){const n=prompt('Nom de la routine','Séance du '+new Date().toLocaleDateString('fr-FR'));if(n&&n.trim())S.routines.push({name:n.trim(),exercises:s.exercises.map(e=>e.name)})}}
    S.current=null;tStop();
  }
  else if(a==='cancel'){if(!confirm('Annuler et supprimer cette séance ?'))return;S.sessions=S.sessions.filter(x=>x.id!==s.id);S.current=null;tStop()}
  else if(a==='delsess'){if(!confirm('Supprimer cette séance ?'))return;S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id)}
  else if(a==='export'){(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(S,null,1)):Promise.reject()).then(()=>alert('Données copiées.')).catch(()=>alert('Copie impossible sur ce navigateur.'));return}
  save();render();
});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
render();
})();
</script>
</body>
</html>
